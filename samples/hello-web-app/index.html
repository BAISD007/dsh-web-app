<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Hello dsh-web-app</title>
<style>
  html, body { margin: 0; height: 100%; }
  body { background: #16181d; color: #e8e8e8; font: 14px/1.6 system-ui, "Segoe UI", sans-serif; display: grid; place-items: center; }
  .card { text-align: center; padding: 40px 48px; border: 1px solid #2e323a; border-radius: 16px; background: #1d2026; }
  h1 { margin: 0 0 6px; font-size: 22px; }
  p { margin: 0 0 18px; color: #9aa0a6; }
  button { appearance: none; border: 0; border-radius: 8px; background: #4d6bfe; color: #fff; padding: 8px 16px; font: inherit; cursor: pointer; }
  button:hover { background: #3f5cf0; }
  #time { color: #9aa0a6; font-variant-numeric: tabular-nums; }
</style>
</head>
<body>
  <div class="card">
    <h1>Hello from dsh-web-app 👋</h1>
    <p>这个页面是从你上传的 zip 里跑起来的静态 Web 应用。</p>
    <p id="time"></p>
    <button id="btn">点我 +1</button>
  </div>
  <script>
    let n = 0
    const btn = document.getElementById('btn')
    btn.addEventListener('click', () => { n += 1; btn.textContent = '点我 +1（' + n + '）' })
    const tick = () => { document.getElementById('time').textContent = '现在时间：' + new Date().toLocaleString('zh-CN') }
    tick(); setInterval(tick, 1000)
  </script>
</body>
</html>
